{% comment %}Standard back-navigation link. Params: href, label, seller (truthy → indigo/gray variant).{% endcomment %}
<a href="{{ href }}" class="{% if seller %}s-back-link{% else %}back-link{% endif %} mb-4">
  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
  </svg>
  {{ label }}
</a>

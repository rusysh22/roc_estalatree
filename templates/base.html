{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% block page_title %}Berlanggan{% endblock %}{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'icons/favicon-512.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/favicon-180.png' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}bg-gray-50 text-gray-900 min-h-screen{% endblock %}" {% block body_attrs %}{% endblock %}>
  <div id="page-progress-bar"></div>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>

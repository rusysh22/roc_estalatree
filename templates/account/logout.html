{% extends "account/base_entrance.html" %}
{% load i18n %}
{% block head_title %}{% trans "Sign Out" %}{% endblock %}

{% block content %}
<div class="text-center mb-6">
  <h1 class="text-2xl font-extrabold text-ink-900 tracking-tight">Sign out</h1>
  <p class="text-sm text-ink-500 mt-2">Are you sure you want to sign out?</p>
</div>

<form method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  <button type="submit"
    class="w-full bg-primary-500 hover:bg-primary-600 text-white text-sm font-bold py-2.5 rounded-full transition-colors mb-3 cursor-pointer">
    Sign Out
  </button>
</form>

<a href="{% url 'storefront:page' %}" class="block text-center text-sm text-ink-400 hover:text-ink-600">
  Cancel
</a>
{% endblock %}

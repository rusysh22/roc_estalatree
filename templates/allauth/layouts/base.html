{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block head_title %}{% endblock %} — Berlanggan</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'icons/favicon-512.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/favicon-180.png' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-cream text-ink-900 min-h-screen" style="font-family: var(--font-sans);">
  <div id="page-progress-bar"></div>
  {% include "partials/_toasts.html" %}
  {% block body %}{% endblock %}
  {% block extra_body %}{% endblock %}
  <script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>

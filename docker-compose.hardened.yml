# Production override:
# docker compose -f docker-compose.yml -f docker-compose.hardened.yml up -d
services:
  web:
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  worker:
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  beat:
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]

{% extends "storefront/base.html" %}
{% block page_title %}Contact — {{ product.name }}{% endblock %}

{% block content %}
<div class="mb-6">
  <a href="{% url 'storefront:page' %}" class="back-link"><svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>Back to marketplace</a>
</div>

<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-extrabold text-ink-900 mb-1 tracking-tight">{{ product.name }}</h1>
  <p class="text-ink-500 text-sm mb-6">Fill in your details and we'll reach out via WhatsApp.</p>

  <div class="landing-card p-6">
    <form method="post">
      {% csrf_token %}

      <div class="mb-4">
        <label for="name" class="block text-sm font-semibold text-ink-700 mb-1">Your name</label>
        <input type="text" id="name" name="name" required placeholder="Full name"
               class="w-full px-3 py-2.5 border border-ink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300">
      </div>

      <div class="mb-5">
        <label for="contact" class="block text-sm font-semibold text-ink-700 mb-1">
          WhatsApp / Email
        </label>
        <input type="text" id="contact" name="contact" required placeholder="081234567890 or email@example.com"
               class="w-full px-3 py-2.5 border border-ink-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-300">
      </div>

      <button type="submit"
              class="w-full bg-moss-500 hover:bg-moss-600 text-white font-bold py-3 rounded-full cursor-pointer transition-colors">
        Send inquiry
      </button>
    </form>
  </div>
</div>
{% endblock %}

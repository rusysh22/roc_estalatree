<div class="bg-gold-50 border border-gold-300 rounded-xl p-3 space-y-2">
  <p class="text-xs font-medium text-gold-800">Secret revealed — copy and store it safely. This is shown only once.</p>
  <div class="bg-white border border-gold-300 rounded-lg flex items-center gap-2 px-3 py-2">
    <code class="flex-1 font-mono text-sm break-all text-ink-800" id="secret-{{ grant.pk }}">{{ plaintext }}</code>
    <button
      onclick="navigator.clipboard.writeText(document.getElementById('secret-{{ grant.pk }}').textContent.trim()).then(() => this.textContent='Copied!').catch(() => {})"
      class="text-xs text-gold-700 hover:text-gold-900 font-medium shrink-0 transition-all">
      Copy
    </button>
  </div>
</div>

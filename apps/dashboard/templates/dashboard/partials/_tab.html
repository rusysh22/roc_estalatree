{% comment %}Bottom-nav tab. Params: url (name), name (url_name), label, path (svg d), cur (active url_name).{% endcomment %}
<a href="{% url url %}"
   class="flex flex-col items-center justify-center gap-1 py-1.5 rounded-xl text-[10px] font-bold transition-colors
          {% if cur == name %}bg-primary-50 text-primary-700{% else %}text-ink-400 active:bg-cream{% endif %}">
  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="{% if cur == name %}2.4{% else %}2{% endif %}" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="{{ path }}"/>
  </svg>
  {{ label }}
</a>

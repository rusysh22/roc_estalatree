services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: berlanggan
      POSTGRES_USER: berlanggan
      POSTGRES_PASSWORD: berlanggan
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

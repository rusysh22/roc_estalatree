upstream roc_gms {
    server roc-gms-web:3000;
}

server {
    listen 80;
    server_name intourney.rusydani.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name intourney.rusydani.my.id;

    ssl_certificate     /etc/letsencrypt/live/intourney.rusydani.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intourney.rusydani.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://roc_gms;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
